name: Publish ws-codex-plugin

on:
  push:
    tags:
      - "ws-codex-plugin-v*"

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package plugin
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ws-codex-plugin-v}"
          archive="ws-codex-plugin-${version}.zip"
          zip -qr "$archive" ws-codex-plugin
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" --generate-notes
